# OrcaPad desktop-parity manifest: the single source of truth for feature
# status. Bridge/tools/parity-check.py extracts the desktop surface from the
# pinned upstream sources and requires every extracted item to be claimed by
# exactly one feature below; done/partial evidence is verified against the
# code; PARITY.md is generated from this file (--write) and checked (--check).
#
# Feature fields:
#   id        area.slug (unique)            area     plate|prepare|preview|device|files|app
#   title     human name                    status   done|partial|missing|deferred|na
#   desktop   extracted item ids claimed    source   "upstream-path:regex" anchor when the
#                                                    desktop feature has no extracted item
#   evidence  OrcaPad proof, all must hold:
#               abi:orca_fn     header decl + Bridge def + facade use + contract test
#               client:REGEX    Sources/OrcaPad/**/*.swift
#               facade:REGEX    Sources/OrcaBridge/*.swift
#               bridge:REGEX    Bridge/engine-cxx/*
#               tests:REGEX     Bridge/tools/contract_tests.cpp
#               plist:REGEX     App-Info.plist
#               resource:PATH   Sources/OrcaPad/Resources/PATH exists
#   gap       what a partial feature lacks  work     UI|Bridge|Closure|Client-reimpl (joined by +)
#   priority  remaining-work order (lower first)
#   reason    why na / deferred             note     free text
#
# Keyboard shortcuts are claimed by the keyboard features (app/plate/preview
# .keyboard) rather than by the feature they trigger: a touch implementation
# does not satisfy a hardware-keyboard shortcut.

[meta]
title = "OrcaPad \u2194 OrcaSlicer desktop parity"
intro = """
Remaining work is ordered by the user's 2026-10-07 sequence: Device printer
web UI, then plate/object editing, prepare/presets/settings, Files
integration, and preview. Deferred by the user (2026-10-07): STEP/SVG import,
Draco, the calibration menu and mesh boolean; AGENTS.md defers the painting
tools until the core loop ships.
"""

