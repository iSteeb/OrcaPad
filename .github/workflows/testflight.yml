# CI for OrcaPad: architecture gates on Linux, the app built with Apple's own
# toolchain on a GitHub-hosted macOS runner, and every main build signed and
# uploaded to TestFlight (internal testing).
#
# The engine is NOT rebuilt here: the app links the committed
# Prebuilt/OrcaBridgeCore.xcframework (cross-built on the Linux dev box by
# Bridge/build-core.sh; the audit checks it matches the Bridge header).
#
# Repository setup (once): environment "testflight" (deployment branch: main)
#   secrets   DIST_P12_BASE64, DIST_P12_PASSWORD, APPSTORE_PROFILE_BASE64, ASC_KEY_P8
#   variables ASC_KEY_ID, ASC_ISSUER_ID
name: CI + TestFlight

on:
  push:
    branches: [main]
    paths: ['**', '!**.md', 'PARITY.md', '!LICENSE']
  pull_request:
    paths: ['**', '!**.md', 'PARITY.md', '!LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel an upload in flight on main; superseded PR runs may go
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_APP: /Applications/Xcode_27.app
  XTOOL_VERSION: 1.20.1
  XTOOL_SHA256: 39123efc283528b119fa3567dc1123059d6690aab76c80e6003470d17c333ca2

jobs:
  verify:
    name: Architecture audit + parity check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # upstream/orcaslicer, shallow
          persist-credentials: false
      - name: Fetch the tag of the pinned upstream commit
        # PARITY.md names the pin via `git describe --tags`; a shallow
        # submodule checkout has no tags, so fetch the one on the pin.
        run: |
          pin="$(git -C upstream/orcaslicer rev-parse HEAD)"
          tag="$(git -C upstream/orcaslicer ls-remote --tags origin |
                 awk -v pin="$pin" '$1 == pin { sub("refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2 }' |
                 head -1)"
          if [ -z "$tag" ]; then
            echo "::error::upstream pin $pin is not a tagged commit"
            exit 1
          fi
          git -C upstream/orcaslicer fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          git -C upstream/orcaslicer describe --tags
      - name: Architecture audit
        run: ./Bridge/tools/architecture-audit.sh
      - name: Parity check
        run: ./Bridge/tools/parity-check.py --check

  build:
    name: Build app (Xcode 27, unsigned)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no submodule: the app links Prebuilt/
      - name: Select Xcode 27
        run: |
          [ -d "$XCODE_APP" ] || { echo "::error::$XCODE_APP is not on this image"; exit 1; }
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version
          case "$(xcodebuild -version | awk 'NR==1 {print $2}')" in
            27.*) ;;
            *) echo "::error::expected Xcode 27"; exit 1 ;;
          esac
      - name: Install xtool ${{ env.XTOOL_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xtool.app.zip" \
            "https://github.com/xtool-org/xtool/releases/download/$XTOOL_VERSION/xtool.app.zip"
          echo "$XTOOL_SHA256  $RUNNER_TEMP/xtool.app.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/xtool.app.zip" "$RUNNER_TEMP/xtool"
          echo "$RUNNER_TEMP/xtool/xtool.app/Contents/MacOS" >> "$GITHUB_PATH"
      - name: Build (release)
        run: |
          xtool --version
          xtool dev build -c release
      - name: Archive the app (tar keeps the executable bit)
        run: tar -C xtool -cf "$RUNNER_TEMP/OrcaPad-app.tar" OrcaPad.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OrcaPad-app-unsigned
          path: ${{ runner.temp }}/OrcaPad-app.tar
          retention-days: 1
          if-no-files-found: error

  testflight:
    name: Sign + upload to TestFlight
    needs: [verify, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 45
    environment: testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OrcaPad-app-unsigned
          path: ${{ runner.temp }}
      - name: Unpack the app
        run: mkdir -p xtool && tar -C xtool -xf "$RUNNER_TEMP/OrcaPad-app.tar"
      - name: Select Xcode 27
        run: |
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Package, sign, validate, upload
        env:
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          ORCAPAD_UPLOAD: "1"
          DIST_P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          APPSTORE_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: ./Distribution/package-testflight.sh
